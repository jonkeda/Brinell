<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Widget Frame</title>
  <style>
    body { font-family: "Segoe UI", Tahoma, sans-serif; margin: 0; padding: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 10px; }
    input { width: 100%; margin-top: 4px; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db; }
    button { width: 100%; padding: 8px; background: #0f766e; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h3 data-testid="profile-frame-heading">Profile Widget</h3>
  <label>Customer ID
    <input type="text" data-testid="profile-id" placeholder="CUST-1001">
  </label>
  <label>Tier
    <input type="text" data-testid="profile-tier" value="Gold">
  </label>
  <button type="button" data-testid="profile-save">Save Profile</button>
</body>
</html>
