<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phase 14 Demo Site - Checkout</title>
  <link rel="stylesheet" href="../assets/site.css">
  <script defer src="../assets/components.js"></script>
  <script defer src="../assets/site.js"></script>
</head>
<body>
  <header>
    <h1 data-testid="checkout-title">Checkout</h1>
    <nav>
      <a href="../index.html">Home</a>
      <a href="catalog.html">Catalog</a>
      <a href="checkout.html">Checkout</a>
      <a href="support.html">Support</a>
    </nav>
  </header>

  <main>
    <section class="grid">
      <article class="card" data-testid="shipping-card">
        <h2>Shipping Address</h2>
        <form class="stack">
          <label>Full Name
            <input type="text" data-testid="ship-name" placeholder="Casey Johnson">
          </label>
          <label>Street
            <input type="text" data-testid="ship-street" placeholder="123 Main St">
          </label>
          <div class="inline">
            <label>City
              <input type="text" data-testid="ship-city" placeholder="Rotterdam">
            </label>
            <label>Postal Code
              <input type="text" data-testid="ship-zip" placeholder="3011AA">
            </label>
          </div>
          <button type="button" data-testid="save-shipping" data-toast="Shipping saved">Save Shipping</button>
        </form>
      </article>

      <article class="card" data-testid="order-summary-card">
        <h2>Order Summary</h2>
        <ul>
          <li>Desk Lamp x1</li>
          <li>USB Hub x2</li>
        </ul>
        <p><strong>Total:</strong> EUR 89.97</p>
        <demo-collapse title="Coupon Code">
          <label>Code
            <input type="text" data-testid="coupon-code" placeholder="SPRING10">
          </label>
          <button type="button" class="secondary" data-testid="apply-coupon" data-toast="Coupon applied">Apply</button>
        </demo-collapse>
      </article>
    </section>

    <section class="card" style="margin-top:1rem" data-testid="payment-frame-section">
      <h2>Payment (IFrame)</h2>
      <iframe src="../frames/payment-frame.html" title="Payment frame" data-testid="checkout-payment-frame"></iframe>
    </section>

    <div id="toastHost" aria-live="polite"></div>
  </main>
</body>
</html>
