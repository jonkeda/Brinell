<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account</title>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body>
  <!-- Explore's dangerous page: each action that changes something hits /api/counter/<category>,
       which the test site counts, so a test proves what Explore did and did not do. -->
  <header>
    <h1 data-testid="account-title">Account</h1>
    <nav>
      <a href="../index.html" data-testid="nav-home">Home</a>
      <a href="catalog.html" data-testid="nav-catalog">Catalog</a>
      <a href="/api/counter/sign-out" data-testid="nav-logout">Log out</a>
    </nav>
  </header>

  <main>
    <section data-testid="account-tabs">
      <div role="tablist">
        <button type="button" role="tab" aria-selected="true" aria-controls="panel-overview" data-testid="tab-overview">Overview</button>
        <button type="button" role="tab" aria-selected="false" aria-controls="panel-history" data-testid="tab-history">History</button>
      </div>
      <div id="panel-overview" role="tabpanel">
        <p>Three open orders.</p>
      </div>
      <div id="panel-history" role="tabpanel" hidden>
        <table data-testid="history-table">
          <thead><tr><th aria-sort="none">Order</th><th>Date</th></tr></thead>
          <tbody><tr><td>SO-1001</td><td>2026-09-01</td></tr></tbody>
        </table>
      </div>
    </section>

    <details data-testid="account-more">
      <summary>More about this account</summary>
      <p>Created in 2024.</p>
    </details>

    <div class="menu">
      <button type="button" aria-haspopup="menu" aria-expanded="false" data-testid="account-menu">Account menu</button>
      <ul role="menu" hidden data-testid="account-menu-items">
        <li role="none"><a role="menuitem" href="support.html">Help</a></li>
        <li role="none"><a role="menuitem" href="/api/counter/sign-out?from=menu">Sign out</a></li>
      </ul>
    </div>

    <button type="button" aria-haspopup="dialog" data-testid="order-details">Order details</button>
    <dialog data-testid="order-dialog">
      <p>SO-1001: two items.</p>
      <button type="button" data-request="POST /api/counter/approve" data-testid="order-confirm">Confirm</button>
      <button type="button" aria-label="Close" data-testid="order-close">&times;</button>
    </dialog>

    <section data-testid="danger-zone">
      <button type="button" data-request="DELETE /api/counter/delete" data-testid="order-delete">Delete</button>
      <button type="button" class="icon" data-request="DELETE /api/counter/delete?via=icon" data-testid="row-4"><i class="fa fa-trash"></i></button>
      <a href="/api/counter/delete?all=1" data-testid="remove-all">Remove all</a>
      <button type="button" data-request="PUT /api/counter/update" data-testid="order-rename">Rename</button>
      <button type="button" data-request="POST /api/counter/send" data-testid="invoice-send">Send invoice</button>
      <button type="button" data-request="POST /api/counter/pay" data-testid="invoice-pay">Pay now</button>
      <button type="button" data-request="POST /api/counter/bulk" data-testid="orders-import">Import</button>
      <button type="button" data-request="POST /api/counter/delete?via=tidy" data-testid="orders-tidy">Tidy up</button>
    </section>

    <form method="post" action="/api/counter/update?via=form" data-testid="profile-form">
      <label>Name <input name="name" data-testid="profile-name"></label>
      <button data-testid="profile-save">Opslaan</button>
    </form>
  </main>

  <script>
    for (const tab of document.querySelectorAll('[role=tab]'))
      tab.addEventListener('click', () => {
        for (const other of document.querySelectorAll('[role=tab]')) {
          other.setAttribute('aria-selected', String(other === tab));
          document.getElementById(other.getAttribute('aria-controls')).hidden = other !== tab;
        }
      });
    const menu = document.querySelector('[aria-haspopup=menu]');
    menu.addEventListener('click', () => {
      const open = menu.getAttribute('aria-expanded') !== 'true';
      menu.setAttribute('aria-expanded', String(open));
      document.querySelector('[role=menu]').hidden = !open;
    });
    const dialog = document.querySelector('dialog');
    document.querySelector('[aria-haspopup=dialog]').addEventListener('click', () => dialog.showModal());
    document.querySelector('[aria-label=Close]').addEventListener('click', () => dialog.close());
    for (const button of document.querySelectorAll('[data-request]'))
      button.addEventListener('click', () => {
        const [method, url] = button.dataset.request.split(' ');
        fetch(url, { method }).catch(() => {});
      });
  </script>
</body>
</html>
