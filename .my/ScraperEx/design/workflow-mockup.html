<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scraper workflow mockup</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1e1e1e; --muted: #6b6b6b; --surface: #f3f3f3; --border: #d4d4d4;
    --accent: #0e639c; --accent-fg: #ffffff; --done: #2e7d32; --attention: #b26a00; --failed: #c62828;
    --font: "Segoe UI", system-ui, sans-serif; --mono: Consolas, "Cascadia Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --fg: #d4d4d4; --muted: #9d9d9d; --surface: #252526; --border: #3c3c3c;
      --accent: #3794ff; --accent-fg: #0b0b0b; --done: #81c784; --attention: #ffb74d; --failed: #ef9a9a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font); }
  .demo { display: flex; gap: 8px; align-items: center; padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .frame { max-width: 1100px; margin: 12px auto; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  header { display: flex; gap: 8px; align-items: end; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .field { display: grid; gap: 2px; }
  .field label { font-size: 11px; color: var(--muted); }
  select, input:not([type]), input[type=text], input[type=number] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; height: 26px; padding: 0 6px; }
  input[type=number] { width: 6em; }
  input.changed, select.changed { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  button { white-space: nowrap; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: 3px; height: 26px; padding: 0 10px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  button.link { background: none; border: none; color: var(--accent); padding: 0; height: auto; }
  .next { margin-left: auto; display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 4px 4px 4px 10px; }
  .next b { font-weight: 600; }
  .strip { display: none; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); flex-wrap: wrap; }
  .strip.on { display: flex; }
  .strip .progress { color: var(--muted); }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: 0.3; } }
  .body { display: grid; grid-template-columns: 220px 1fr; min-height: 520px; }
  nav { border-right: 1px solid var(--border); padding: 8px 0; }
  .step { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center; padding: 6px 12px; cursor: pointer; border-left: 3px solid transparent; }
  .step:hover { background: var(--surface); }
  .step[aria-current="true"] { background: var(--surface); border-left-color: var(--accent); }
  .step .mark { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; border: 1px solid var(--border); color: var(--muted); }
  .step.done .mark { background: var(--done); border-color: var(--done); color: var(--bg); }
  .step.nextup .mark { border: 2px solid var(--accent); color: var(--accent); font-weight: 700; }
  .step.attention .mark { background: var(--attention); border-color: var(--attention); color: var(--bg); }
  .step .sub { grid-column: 2 / 4; font-size: 11px; color: var(--muted); margin-top: -4px; }
  .badge { font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); }
  .badge.attn { background: var(--attention); color: var(--bg); }
  nav hr { border: none; border-top: 1px solid var(--border); margin: 8px 12px; }
  nav .aside { padding: 4px 12px 4px 41px; cursor: pointer; color: var(--muted); }
  nav .aside:hover { color: var(--fg); }
  main { padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  main h2 { margin: 0; font-size: 16px; }
  main h2 small { color: var(--muted); font-weight: normal; margin-left: 6px; }
  main h3 { margin: 4px 0 0; font-size: 13px; }
  .why { color: var(--muted); margin: -6px 0 0; }
  .facts { display: flex; gap: 10px; flex-wrap: wrap; }
  .fact { border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; min-width: 110px; }
  .fact b { display: block; font-size: 18px; }
  .fact span { color: var(--muted); font-size: 11px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: 11px; color: var(--muted); font-weight: 600; }
  td.check, th.check { width: 28px; }
  code, pre { font-family: var(--mono); font-size: 12px; }
  pre.code { margin: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); overflow: auto; max-height: 260px; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  details.more summary { cursor: pointer; color: var(--accent); }
  details.more div { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; }
  .ok { color: var(--done); } .warn { color: var(--attention); } .bad { color: var(--failed); }
  .intro { border: 1px dashed var(--accent); border-radius: 4px; padding: 8px 12px; }
  .intro ol { margin: 6px 0 4px; padding-left: 20px; }
  .intro p { margin: 0; color: var(--muted); }
  fieldset { border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px 10px; margin: 0; }
  legend { padding: 0 4px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: max-content 1fr max-content 1fr; gap: 6px 12px; align-items: center; }
  .grid .hint { grid-column: 1 / -1; color: var(--muted); font-size: 11px; margin-top: -2px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips label { border: 1px solid var(--border); border-radius: 12px; padding: 1px 8px; display: inline-flex; gap: 4px; align-items: center; }
  .list { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .item { border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; font-family: var(--mono); font-size: 12px; }
  .item button { height: auto; border: none; background: none; padding: 0 0 0 4px; color: var(--muted); }
  .saved { color: var(--muted); font-size: 12px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .note { width: 100%; min-height: 54px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 4px 6px; }
  .pill { font-size: 11px; border-radius: 8px; padding: 0 6px; border: 1px solid currentColor; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 6px 12px; border-radius: 4px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.on { opacity: 0.92; }
  @media (max-width: 760px) { .body { grid-template-columns: 1fr; } nav { border-right: none; } .two, .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="demo">
  <strong>Mockup</strong> (made-up data) ·
  <label>Project state <select id="scenario">
    <option value="new">New project</option>
    <option value="controls" selected>Recorded, controls to make</option>
    <option value="made">Controls made, to review</option>
    <option value="changed">Verified, then the app changed</option>
  </select></label>
</div>

<div class="frame">
  <header>
    <div class="field">
      <label for="project">Project</label>
      <div style="display:flex;gap:4px"><select id="project"><option>Bruinet.Html.React</option><option>Bruinet.Html.Plain</option><option>Bruinet.Blazor.UITests</option></select><button title="New scraped project" aria-label="New scraped project">+</button></div>
    </div>
    <div class="next" id="next"></div>
  </header>
  <div class="strip" id="strip">
    <span class="pulse"></span><b>Exploring</b><span class="progress" id="progress">starting…</span>
    <button>Capture</button><button>Pick</button><button id="stop">Stop</button>
    <select><option>This page…</option><option>Add its host to Explore hosts</option><option>Never visit it</option></select>
  </div>
  <div class="body">
    <nav id="steps" aria-label="Steps"></nav>
    <main id="panel"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const steps = [
  { n: 1, name: "Project" }, { n: 2, name: "Connect" }, { n: 3, name: "Collect pages" }, { n: 4, name: "Review" },
  { n: 5, name: "Controls" }, { n: 6, name: "Page objects" }, { n: 7, name: "Verify" },
];
const scenarios = {
  new: {
    states: ["done", "next", "todo", "todo", "todo", "todo", "todo"], subs: ["", "", "", "", "", "", ""], badges: {},
    next: { text: "Check that the Scraper can reach the app", step: 2 }, intro: true,
  },
  controls: {
    states: ["done", "done", "done", "done", "next", "todo", "todo"],
    subs: ["", "signed in", "1 page, 4 captures", "33 skipped, 5 blocked", "", "", ""], badges: { 5: "3" },
    next: { text: "Make the 3 controls Draft asked for", step: 5 },
  },
  made: {
    states: ["done", "done", "done", "done", "attention", "todo", "todo"],
    subs: ["", "signed in", "1 page, 4 captures", "33 skipped, 5 blocked", "2 made, 1 to fix", "", ""], badges: { 5: "1" }, warn: { 5: true },
    next: { text: "Review the 2 controls the agent made", step: 5 },
  },
  changed: {
    states: ["done", "done", "attention", "done", "done", "attention", "attention"],
    subs: ["", "signed in", "1 page changed", "", "2 controls", "1 changed since", "6 not found"], badges: { 3: "1", 6: "1", 7: "6" }, warn: { 3: true, 6: true, 7: true },
    next: { text: "Re-record the changed page, then update its page object", step: 3 },
  },
};
// Explore's settings, as the config has them; the form edits a copy and Save writes the rows that changed.
const saved = {
  MaxPages: 5, MaxDepth: 1, MaxMinutes: 2, DelayMs: 2000, Within: "/tabs", ClickPolicy: "safe", WebsocketApps: "links",
  BlockMethods: ["POST", "PUT", "PATCH", "DELETE"], DangerOff: [], Hosts: ["localhost", "127.0.0.1", "demoqa.com"],
};
let settings = structuredClone(saved);
const patterns = [
  { sig: "div.element-group", where: "6× on /tabs", like: "sidebar group", name: "SideMenuGroup" },
  { sig: "li.btn.btn-light", where: "32× on /tabs", like: "menu item", name: "SideMenuItem" },
  { sig: "div.ad-slot", where: "3× on /tabs", like: "advert", name: "AdSlot" },
];
let picked = new Set(["div.element-group", "li.btn.btn-light"]);
const made = [
  { name: "SideMenuGroup", file: "Controls/SideMenuGroup.cs", from: "div.element-group", parts: 3, used: "TabsPage (6 members)", build: "ok", found: "6 of 6 groups", state: "ok" },
  { name: "SideMenuItem", file: "Controls/SideMenuGroup.cs (nested)", from: "li.btn.btn-light", parts: 2, used: "SideMenuGroup.Items", build: "ok", found: "Text found in 30 of 32, Link in 32 of 32", state: "fix" },
];
const pages = [
  { key: "/tabs", name: "TabsPage", object: "TabsPage.scraped.cs + your part", members: "36, 5 unstable", state: "builds" },
  { key: "/tabs#more", name: "TabsMorePage", object: "none", members: "", state: "not drafted" },
  { key: "/tabs/print", name: "TabsPrintPage", object: "TabsPrintPage.scraped.cs", members: "12", state: "changed since" },
];
let pickedPages = new Set(["/tabs#more"]);
let scenario = "controls", current = 5, reviewing = null;

const $ = id => document.getElementById(id);
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); }
function go(n) { current = n; reviewing = null; render(); }

function renderNav() {
  const s = scenarios[scenario];
  $("steps").innerHTML = steps.map((st, i) => {
    const state = s.states[i];
    const mark = state === "done" ? "✓" : state === "attention" ? "!" : st.n;
    const badge = s.badges[st.n] ? `<span class="badge ${s.warn && s.warn[st.n] ? "attn" : ""}">${s.badges[st.n]}</span>` : "<span></span>";
    return `<div class="step ${state === "next" ? "nextup" : state}" id="sc-step-${st.n}" role="button" tabindex="0" aria-current="${st.n === current}" data-step="${st.n}">
      <span class="mark">${mark}</span><span class="label">${st.name}</span>${badge}
      ${s.subs[i] ? `<span class="sub">${s.subs[i]}</span>` : ""}</div>`;
  }).join("") + `<hr><div class="aside" data-aside="code">Code</div>`;
  for (const el of document.querySelectorAll("[data-step]")) el.onclick = () => go(Number(el.dataset.step));
  for (const el of document.querySelectorAll("[data-aside]")) el.onclick = () => { current = el.dataset.aside; render(); };
  const n = s.next;
  $("next").innerHTML = `<span>Next: <b>${n.text}</b></span><button class="primary" id="go">Go</button>`;
  $("go").onclick = () => go(n.step);
}

const more = items => `<details class="more"><summary>More</summary><div>${items.map(i => `<button>${i}</button>`).join("")}</div></details>`;
const footer = (n, skip) => `<div class="footer"><span>${skip ? `<button class="link" data-skip>Skip: ${skip}</button>` : ""}</span>${n < 7 ? `<button data-next>Next: ${steps[n].name} ▸</button>` : "<span></span>"}</div>`;
const intro = () => scenarios[scenario].intro ? `<div class="intro"><b>Three steps to page objects</b>
  <ol><li>Connect to the app</li><li>Collect its pages</li><li>Draft page objects</li></ol>
  <p>Each step says what to do next.</p></div>` : "";

// Step 3: the guards and budget as a form; the fields that differ from the file are marked, and Save writes them.
function settingsForm() {
  const num = (k, label) => `<label for="s-${k}">${label}</label><input type="number" id="s-${k}" data-k="${k}" value="${settings[k]}">`;
  const sel = (k, label, options) => `<label for="s-${k}">${label}</label><select id="s-${k}" data-k="${k}">${options.map(o => `<option ${o === settings[k] ? "selected" : ""}>${o}</option>`).join("")}</select>`;
  const methods = ["POST", "PUT", "PATCH", "DELETE"].map(m => `<label><input type="checkbox" data-method="${m}" ${settings.BlockMethods.includes(m) ? "checked" : ""}> ${m}</label>`).join("");
  const danger = ["sign-out", "delete", "update", "send", "pay", "approve", "bulk"].map(c => `<label><input type="checkbox" data-danger="${c}" ${settings.DangerOff.includes(c) ? "" : "checked"}> ${c}</label>`).join("");
  const hosts = settings.Hosts.map(h => `<span class="item">${h}<button data-host-remove="${h}" title="Remove">×</button></span>`).join("");
  return `<fieldset><legend>Guards and budget</legend>
    <div class="grid">
      ${num("MaxPages", "Max pages")}${num("MaxDepth", "Max depth")}
      ${num("MaxMinutes", "Max minutes")}${num("DelayMs", "Pause between clicks (ms)")}
      <label for="s-Within">Within</label><input type="text" id="s-Within" data-k="Within" value="${settings.Within}">
      ${sel("WebsocketApps", "Websocket apps", ["links", "warn", "ignore"])}
      <span class="hint">Within keeps Explore on one page and its states (a path or /#/route); empty for the whole app.</span>
      ${sel("ClickPolicy", "Clicks", ["links", "safe", "not-unsafe", "all"])}
      <span></span><span></span>
      <label>Blocked requests</label><div class="chips" style="grid-column: 2 / -1">${methods}</div>
      <label>Danger words</label><div class="chips" style="grid-column: 2 / -1">${danger}</div>
      <label>Explore hosts</label><div class="list" style="grid-column: 2 / -1">${hosts}<input type="text" id="s-host-new" placeholder="add a host" style="width: 12em"><button id="s-host-add">Add</button></div>
    </div>
    <div class="actions" style="margin-top: 10px"><button id="s-save" class="primary" disabled>Save</button><button id="s-reset" disabled>Undo changes</button>
      <span class="saved" id="s-state">Saved in scraper.config.md</span>${more(["Never click…", "Always click…", "Never visit…", "Allow requests…", "Open scraper.config.md"])}</div>
  </fieldset>`;
}
function changedKeys() {
  const keys = [];
  for (const k of ["MaxPages", "MaxDepth", "MaxMinutes", "DelayMs", "Within", "ClickPolicy", "WebsocketApps"]) if (String(settings[k]) !== String(saved[k])) keys.push(k);
  if (settings.BlockMethods.join() !== saved.BlockMethods.join()) keys.push("BlockMethods");
  if (settings.DangerOff.join() !== saved.DangerOff.join()) keys.push("Danger words");
  if (settings.Hosts.join() !== saved.Hosts.join()) keys.push("Explore hosts");
  return keys;
}
function wireSettings() {
  const refresh = () => {
    const keys = changedKeys();
    $("s-save").disabled = $("s-reset").disabled = keys.length === 0;
    $("s-state").textContent = keys.length ? `Changed: ${keys.join(", ")}. Not saved yet.` : "Saved in scraper.config.md";
    for (const el of document.querySelectorAll("[data-k]")) el.classList.toggle("changed", String(settings[el.dataset.k]) !== String(saved[el.dataset.k]));
  };
  for (const el of document.querySelectorAll("[data-k]")) el.oninput = el.onchange = () => { settings[el.dataset.k] = el.type === "number" ? Number(el.value) : el.value; refresh(); };
  for (const el of document.querySelectorAll("[data-method]")) el.onchange = () => { settings.BlockMethods = [...document.querySelectorAll("[data-method]:checked")].map(c => c.dataset.method); refresh(); };
  for (const el of document.querySelectorAll("[data-danger]")) el.onchange = () => { settings.DangerOff = [...document.querySelectorAll("[data-danger]:not(:checked)")].map(c => c.dataset.danger); refresh(); };
  for (const el of document.querySelectorAll("[data-host-remove]")) el.onclick = () => { settings.Hosts = settings.Hosts.filter(h => h !== el.dataset.hostRemove); render(); };
  $("s-host-add").onclick = () => { const v = $("s-host-new").value.trim(); if (v) { settings.Hosts = [...settings.Hosts, v]; render(); } };
  $("s-save").onclick = () => { const n = changedKeys().length; Object.assign(saved, structuredClone(settings)); toast(`Saved: ${n} change${n > 1 ? "s" : ""} in scraper.config.md, the rest of the file kept`); render(); };
  $("s-reset").onclick = () => { settings = structuredClone(saved); render(); };
  refresh();
}

const panels = {
  1: () => `<h2>1 Project</h2><p class="why">The UI test project the page objects go into.</p>
    <table><tr><th>Folder</th><td><code>Scraper.Sites/Bruinet.Html.React</code></td></tr><tr><th>Platform</th><td>html</td></tr>
    <tr><th>Start URL</th><td><code>https://demoqa.com/tabs</code></td></tr><tr><th>Namespace</th><td><code>Bruinet.Html.React.Pages</code></td></tr></table>
    <div class="actions"><button class="primary" id="sc-primary">New project…</button>${more(["Open scraper.config.md", "Add a config to an existing project"])}</div>${footer(1)}`,
  2: () => `<h2>2 Connect</h2><p class="why">Can the Scraper reach the app, signed in, and may it go there?</p>${intro()}
    <table><tr><th>Start URL</th><td><code>https://demoqa.com/tabs</code></td></tr>
    ${scenario === "new" ? `<tr><th>Last check</th><td class="warn">Not checked yet</td></tr>` : `<tr><th>Answered</th><td class="ok">200 in 0.3 s</td></tr><tr><th>Signed in</th><td class="ok">no sign-in needed</td></tr><tr><th>Host</th><td class="ok">demoqa.com is an Explore host</td></tr>`}</table>
    <div class="actions"><button class="primary" id="sc-primary" data-check>Check the app</button>${more(["Open the browser to sign in", "Change the start URL", "Aliases", "Clear the browser profile"])}</div>${footer(2)}`,
  3: () => `<h2>3 Collect pages</h2><p class="why">Explore visits the app's pages and states by itself, inside the guards below. Change them here; Save writes them to the config.</p>
    ${scenario === "changed" ? `<p class="warn">! /tabs changed since its page object was made (2 nodes added, 1 removed). Explore again, or record it by hand.</p>` : ""}
    ${settingsForm()}
    <table><tr><th>Run</th><th>Captures</th><th>Clicks</th><th>Skipped</th><th>Blocked</th><th>Stopped</th></tr>
    <tr><td>2026-10-01 explore</td><td>4</td><td>3</td><td>33</td><td>5</td><td>everything within reach</td></tr>
    <tr><td>2026-10-01 dry run</td><td>1</td><td>0</td><td>36</td><td>2</td><td>dry run</td></tr></table>
    <div class="actions"><label><input type="checkbox"> Dry run</label><button class="primary" id="sc-primary" data-explore>Explore</button>${more(["Record by hand…", "Open explore.md"])}</div>${footer(3)}`,
  4: () => `<h2>4 Review</h2><p class="why">What was recorded, and what Explore left alone. Nothing to do here unless something looks wrong.</p>
    <div class="facts"><div class="fact"><b>3</b><span>pages</span></div><div class="fact"><b>6</b><span>captures</span></div><div class="fact"><b>33</b><span>skipped</span></div><div class="fact"><b>5</b><span>requests blocked</span></div></div>
    <table><tr><th>Page</th><th>Captures</th><th>Page object</th><th></th></tr>
    <tr><td><code>/tabs</code> Tabs</td><td>start, What, Origin, Use</td><td>TabsPage</td><td><button>Outline</button> <button>Compare</button></td></tr></table>
    <table><tr><th>Skipped, by reason</th><th></th><th></th></tr>
    <tr><td>outside Within /tabs</td><td>33 links</td><td><button>Show</button></td></tr>
    <tr><td>danger word 'send'</td><td>Send feedback</td><td><button>Never click</button> <button>Always click</button></td></tr>
    <tr><td>another host</td><td>3 ads</td><td><button>Show</button></td></tr></table>${footer(4)}`,
  5: () => reviewing ? reviewPanel() : controlsPanel(),
  6: () => {
    const rows = pages.map(p => `<tr><td class="check"><input type="checkbox" data-page="${p.key}" ${pickedPages.has(p.key) ? "checked" : ""}></td>
      <td><code>${p.key}</code></td>
      <td><input type="text" value="${p.name}" data-rename="${p.key}" aria-label="Class name for ${p.key}" style="width: 13em"></td>
      <td>${p.object}</td><td>${p.members}</td>
      <td>${p.state === "builds" ? `<span class="ok">builds</span>` : p.state === "changed since" ? `<span class="warn">changed since</span>` : `<span class="saved">not drafted</span>`}</td></tr>`).join("");
    return `<h2>6 Page objects</h2><p class="why">A page object per page: tick the pages to draft, give a class a better name before or after. Drafting again keeps the name.</p>
    <table><tr><th class="check"><input type="checkbox" id="all-pages" aria-label="All pages"></th><th>Page</th><th>Class</th><th>File</th><th>Members</th><th>State</th></tr>${rows}</table>
    <div class="actions"><button class="primary" id="sc-primary" data-draft>Draft ${pickedPages.size} page object${pickedPages.size === 1 ? "" : "s"}</button>
      <button data-improve ${pickedPages.size ? "" : "disabled"}>Improve with the agent</button>${more(["Draft all pages", "Generate page object (agent)", "Open the Pages folder"])}</div>${footer(6)}`;
  },
  7: () => `<h2>7 Verify</h2><p class="why">Opens each page in the running app and finds every member's locator.</p>
    <div class="facts"><div class="fact"><b class="${scenario === "changed" ? "bad" : "ok"}">${scenario === "changed" ? "30" : "36"}</b><span>found once</span></div><div class="fact"><b>6</b><span>${scenario === "changed" ? "not found" : "found through their controls"}</span></div><div class="fact"><b>0</b><span>found several times</span></div></div>
    ${scenario === "changed" ? `<table><tr><th>Member</th><th>Locator</th><th></th></tr><tr><td>TabsPage.Origin</td><td><code>#demo-tab-origin</code></td><td><button>Open</button> <button>Re-record /tabs</button></td></tr></table>` : ""}
    <p class="why">Last run 2026-10-01 12:46 against https://demoqa.com/tabs.</p>
    <div class="actions"><button class="primary" id="sc-primary">Verify</button>${more(["Verify headed (watch it)"])}</div>${footer(7)}`,
  code: () => `<h2>Code <small>the project's page objects and controls</small></h2>
    <table><tr><th>File</th><th>Kind</th><th>Made from</th></tr><tr><td>Pages/TabsPage.scraped.cs</td><td>page</td><td>2026-10-01-explore/001</td></tr><tr><td>Pages/TabsPage.cs</td><td>your part</td><td></td></tr><tr><td>Controls/SideMenuGroup.cs</td><td>control</td><td>div.element-group</td></tr></table>`,
};

// Step 5: tick the patterns, make them in one go; what was made below, each to review.
function controlsPanel() {
  const toMake = scenario === "made" || scenario === "changed" ? patterns.filter(p => !made.some(m => m.from === p.sig)) : patterns;
  const rows = toMake.map(p => `<tr><td class="check"><input type="checkbox" data-pattern="${p.sig}" ${picked.has(p.sig) ? "checked" : ""}></td>
    <td><code>${p.sig}</code></td><td>${p.where}</td><td>${p.like}</td><td><input type="text" value="${p.name}" aria-label="Control name for ${p.sig}" style="width: 11em"></td></tr>`).join("");
  const count = toMake.filter(p => picked.has(p.sig)).length;
  const makeTable = toMake.length ? `<h3>To make</h3><table><tr><th class="check"><input type="checkbox" id="all-patterns" aria-label="All patterns"></th><th>Pattern</th><th>Where</th><th>Looks like</th><th>Control name</th></tr>${rows}</table>
    <div class="actions"><button class="primary" id="sc-primary" data-make ${count ? "" : "disabled"}>Make ${count} control${count === 1 ? "" : "s"} with the agent</button>${more(["Show all patterns (forms, tables, navigation)", "Open the Controls folder"])}</div>` : "";
  const madeTable = scenario === "made" || scenario === "changed" ? `<h3>Made</h3><table><tr><th>Control</th><th>From</th><th>Used by</th><th>Builds</th><th>Found in the recordings</th><th></th></tr>
    ${made.map(m => `<tr><td><b>${m.name}</b><br><small>${m.file}</small></td><td><code>${m.from}</code></td><td>${m.used}</td>
      <td class="ok">✓</td><td class="${m.state === "ok" ? "ok" : "warn"}">${m.found}</td>
      <td><button class="${m.state === "ok" ? "" : "primary"}" data-review="${m.name}">${m.state === "ok" ? "Review" : "Review and fix"}</button></td></tr>`).join("")}</table>` : "";
  return `<h2>5 Controls</h2><p class="why">Parts that repeat become a control first, so page objects use them instead of a member each. Tick the ones to make; the agent makes them in one go.</p>
    ${makeTable}${madeTable}${footer(5, "page objects without controls")}`;
}

// A made control: its code, where it is found, and what to change; the agent fixes it from a note, or open the file.
function reviewPanel() {
  const m = made.find(c => c.name === reviewing);
  const code = m.name === "SideMenuGroup"
    ? `public sealed class SideMenuGroup&lt;TParent&gt; : ContainerBase&lt;TParent, SideMenuGroup&lt;TParent&gt;&gt;
{
    public SideMenuGroup(IHtmlScope&lt;TParent&gt; parent, string header)
        : base(parent, Locator.ByCss($"div.element-group:has(.header-text:has-text(\\"{header}\\"))")) { }

    public LabelControl&lt;SideMenuGroup&lt;TParent&gt;&gt; Header =&gt; new(this, Locator.ByCss(".header-text"));
    public SideMenuItems Items =&gt; new(this);
    public void Open(string text) =&gt; Items.Row(text).Click();
}`
    : `public sealed class SideMenuItem : ItemObjectBase&lt;SideMenuItem&gt;
{
    public LabelControl&lt;SideMenuItem&gt; Text =&gt; new(this, Locator.ByCss("span.text"));
    public LinkControl&lt;SideMenuItem&gt; Link =&gt; new(this, Locator.ByCss("a"));
}`;
  const parts = m.name === "SideMenuGroup"
    ? [["Header", ".header-text", "6 of 6", "ok"], ["Items", "ul.menu-list › li.btn.btn-light", "6 of 6", "ok"], ["(root)", "div.element-group:has(…)", "6 of 6", "ok"]]
    : [["Text", "span.text", "30 of 32", "warn"], ["Link", "a", "32 of 32", "ok"]];
  return `<h2>5 Controls <small>› ${m.name}</small></h2>
    <p class="why">Made by the agent from <code>${m.from}</code>. Check where its parts are found, then accept it, fix it by hand, or tell the agent what to change.</p>
    <div class="two">
      <div><h3>Code <small><button class="link">Open ${m.file}</button></small></h3><pre class="code">${code}</pre></div>
      <div><h3>Its parts in the recordings</h3>
        <table><tr><th>Part</th><th>Locator</th><th>Found in</th></tr>
        ${parts.map(p => `<tr><td>${p[0]}</td><td><code>${p[1]}</code></td><td class="${p[3]}">${p[2]}${p[3] === "warn" ? ` <button class="link" data-show>show the 2</button>` : ""}</td></tr>`).join("")}</table>
        ${m.state === "ok" ? "" : `<p class="warn">2 menu items have their text in a <code>div</code>, not a <code>span.text</code>: <i>Book Store API</i>, <i>Profile</i>.</p>`}
        <h3>Used by</h3><p>${m.used}</p></div>
    </div>
    <h3>Tell the agent what to change</h3>
    <textarea class="note" placeholder="e.g. The text is sometimes in a div; find it by the row's own text instead.">${m.state === "ok" ? "" : "Find the item's text by the row's own text, not span.text: two items have it in a div."}</textarea>
    <div class="actions">
      <button class="primary" data-fix>Fix with the agent</button>
      <button data-accept>Accept</button>
      <button>Check again</button>
      ${more(["Rename the control", "Open the file to fix by hand", "Delete the control"])}
    </div>
    <div class="footer"><button class="link" data-back>‹ All controls</button><span class="saved">After a fix: built and checked against the recordings again; the diff shows in the IDE.</span></div>`;
}

function render() {
  renderNav();
  $("panel").innerHTML = panels[current]();
  const on = (sel, f) => { for (const el of document.querySelectorAll(sel)) el.addEventListener("click", f); };
  on("[data-next]", () => go(current + 1));
  on("[data-skip]", () => { toast("Controls skipped: remembered for this project"); go(6); });
  on("[data-explore]", runExplore);
  on("[data-check]", () => { if (scenario === "new") scenario = "controls"; toast("The app answered; no sign-in needed"); go(3); });
  on("[data-make]", () => { scenario = "made"; $("scenario").value = "made"; toast(`The agent's chat opens to make ${picked.size} controls; they show under Made as they come`); render(); });
  on("[data-review]", e => { reviewing = e.target.dataset.review; render(); });
  on("[data-back]", () => { reviewing = null; render(); });
  on("[data-fix]", () => toast("The agent gets the control, its parts' results and your note; the change shows as a diff"));
  on("[data-accept]", () => { const m = made.find(c => c.name === reviewing); m.state = "ok"; m.found = "accepted as is"; reviewing = null; toast("Accepted"); render(); });
  on("[data-show]", () => toast("The 2 captures open with the items highlighted"));
  on("[data-draft]", () => toast(pickedPages.size ? `Drafted ${[...pickedPages].join(", ")}; the build passed` : "Tick a page first"));
  on("[data-improve]", () => toast(`The agent's chat opens on ${pickedPages.size} page object(s)`));
  for (const el of document.querySelectorAll("[data-pattern]")) el.onchange = () => { el.checked ? picked.add(el.dataset.pattern) : picked.delete(el.dataset.pattern); render(); };
  for (const el of document.querySelectorAll("[data-page]")) el.onchange = () => { el.checked ? pickedPages.add(el.dataset.page) : pickedPages.delete(el.dataset.page); render(); };
  for (const el of document.querySelectorAll("[data-rename]")) el.onchange = () => { const p = pages.find(x => x.key === el.dataset.rename); toast(`${p.name} renamed to ${el.value}: the class, its file and your part; drafting again keeps it`); p.name = el.value; };
  if ($("all-patterns")) $("all-patterns").onchange = e => { for (const p of patterns) e.target.checked ? picked.add(p.sig) : picked.delete(p.sig); render(); };
  if ($("all-pages")) $("all-pages").onchange = e => { for (const p of pages) e.target.checked ? pickedPages.add(p.key) : pickedPages.delete(p.key); render(); };
  if ($("s-save")) wireSettings();
  for (const b of document.querySelectorAll("main details.more button")) b.addEventListener("click", () => toast(b.textContent.trim()));
}

function runExplore() {
  const strip = $("strip");
  strip.classList.add("on");
  let captured = 1, clicked = 0;
  const timer = setInterval(() => {
    $("progress").textContent = `captured ${captured}, clicked ${clicked}, skipped ${clicked * 11}, blocked ${clicked + 2}`;
    if (captured >= 4) { clearInterval(timer); setTimeout(() => { strip.classList.remove("on"); toast("Explore done: 4 captures"); go(4); }, 800); }
    captured++; clicked++;
  }, 700);
  $("stop").onclick = () => { clearInterval(timer); strip.classList.remove("on"); toast("Stopped; the recording so far stays"); };
}

$("scenario").onchange = e => { scenario = e.target.value; current = scenarios[scenario].next.step; reviewing = null; render(); };
render();
</script>
</body>
</html>
