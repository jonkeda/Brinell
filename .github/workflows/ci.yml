name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java (Android build)
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Restore workloads
        run: dotnet workload restore srcnew/Brinell.sln

      # Debug on purpose: the UI Automation bridge only compiles in Debug
      # (srcnew/Brinell.Uia.Contracts/Brinell.Uia.Bridge.props), and Debug is what the
      # test suites are written against.
      # Every project in the repository but the two VSIX projects (see ide-extensions).
      - name: Build
        run: dotnet build srcnew/Brinell.sln -v:minimal /nr:false

      # Unit tests only. The *.UITests and *.Uat.Tests projects launch real apps and
      # stay local; see AGENTS.md "Match the test scope to the change".
      - name: Unit tests
        shell: pwsh
        run: |
          $projects = @(
            'Brinell.Core.Tests',
            'Brinell.Maui.Tests',
            'Brinell.Wpf.Tests',
            'Brinell.WinForms.Tests',
            'Brinell.Blazor.Tests',
            'Brinell.Html.Tests',
            'Brinell.Automation.Tests',
            'Brinell.Mocking.Tests',
            'Brinell.Mocking.Analyzers.Tests',
            'Brinell.Uat.Tests',
            'Brinell.TestData.Tests',
            'Brinell.DataValidator.Tests',
            'Brinell.Generator.Tests'
          )
          $failed = @()
          foreach ($p in $projects) {
            dotnet test "testsnew/$p/$p.csproj" --no-build -v:minimal `
              --logger "trx;LogFileName=$p.trx" --results-directory TestResults/ci
            if ($LASTEXITCODE -ne 0) { $failed += $p }
          }
          if ($failed) { Write-Error "Failed: $($failed -join ', ')"; exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/ci/*.trx
          if-no-files-found: warn

  pack:
    name: Pack
    runs-on: windows-latest
    needs: build-and-test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore workloads
        run: dotnet workload restore srcnew/Brinell.Maui.Extensions/Brinell.Maui.Extensions.csproj srcnew/Brinell.Maui.CommunityToolkit/Brinell.Maui.CommunityToolkit.csproj

      - name: Pack libraries
        shell: pwsh
        run: ./tools/Scripts/pack.ps1 -Version "0.1.0-ci.${{ github.run_number }}" -Output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  # The IDE extensions build: the VSIX needs Visual Studio's MSBuild, so Brinell.sln holds its two
  # projects with Build unticked, and they are built here from their own .slnx.
  # Their tests (Brinell.Bdd.*.Tests) need the Todo sample built and stay local, like the UI tests.
  ide-extensions:
    name: IDE extensions
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Visual Studio extension
        run: msbuild tools/Brinell.Bdd.VisualStudio/Brinell.Bdd.VisualStudio.slnx -restore -p:DeployExtension=false -v:minimal

      - name: VS Code extension
        shell: pwsh
        working-directory: tools/Brinell.Bdd.VsCode
        run: |
          npm ci
          npm run compile

      - name: Upload the VSIX
        uses: actions/upload-artifact@v4
        with:
          name: visual-studio-extension
          path: tools/Brinell.Bdd.VisualStudio/bin/Debug/net48/Brinell.Bdd.VisualStudio.vsix
