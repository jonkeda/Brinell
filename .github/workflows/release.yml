name: Release

# Publishing a GitHub release tagged vX.Y.Z (or vX.Y.Z-suffix) packs the libraries with
# that version and pushes them to this organisation's GitHub Packages feed. The repo is
# private, so nothing goes to nuget.org.

on:
  release:
    types: [ published ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
            Write-Error "Tag '$tag' is not vX.Y.Z or vX.Y.Z-suffix"; exit 1
          }
          "value=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Restore workloads
        run: dotnet workload restore srcnew/Bruinet.Maui.CommunityToolkit/Bruinet.Maui.CommunityToolkit.csproj

      - name: Pack libraries
        shell: pwsh
        run: ./tools/Scripts/pack.ps1 -Version "${{ steps.version.outputs.value }}" -Output artifacts

      - name: Push to GitHub Packages
        shell: pwsh
        run: |
          dotnet nuget push "artifacts/*.nupkg" `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.nupkg --clobber

  # The IDE extensions, attached to the release: the Visual Studio VSIX and the VS Code VSIX, each
  # carrying the language server. Stamped with the tag's version (without a suffix, which neither
  # manifest takes).
  extensions:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup MSBuild (the VSIX needs Visual Studio's)
        uses: microsoft/setup-msbuild@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Tag '$tag' is not vX.Y.Z or vX.Y.Z-suffix"; exit 1
          }
          "value=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Stamp the versions
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $manifest = 'tools/Bruinet.Bdd.VisualStudio/source.extension.vsixmanifest'
          (Get-Content $manifest -Raw) -replace '(<Identity [^>]*Version=")[^"]*', "`${1}$version" | Set-Content $manifest -NoNewline
          Push-Location tools/Bruinet.Bdd.VsCode
          npm version $version --no-git-tag-version --allow-same-version
          Pop-Location

      - name: Visual Studio extension
        shell: pwsh
        run: |
          msbuild tools/Bruinet.Bdd.VisualStudio/Bruinet.Bdd.VisualStudio.slnx -restore -p:Configuration=Release -p:DeployExtension=false -v:minimal
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item tools/Bruinet.Bdd.VisualStudio/bin/Release/net48/Bruinet.Bdd.VisualStudio.vsix "artifacts/Bruinet.Bdd.VisualStudio-${{ steps.version.outputs.value }}.vsix"

      - name: VS Code extension
        shell: pwsh
        run: |
          dotnet publish tools/Bruinet.Cli -c Release -o tools/Bruinet.Bdd.VsCode/server --nologo -v:q
          Push-Location tools/Bruinet.Bdd.VsCode
          npm ci
          npm run compile
          npx --yes @vscode/vsce@3 package --allow-missing-repository --skip-license -o "../../artifacts/bruinet-bdd-vscode-${{ steps.version.outputs.value }}.vsix"
          Pop-Location

      - name: Attach the extensions to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.vsix --clobber
